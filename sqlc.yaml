version: "2"

sql:
  - engine: "postgresql"
    schema: "./src/services/auth/db/migrations/"
    queries: "./src/services/auth/db/queries.sql"
    gen:
      go: &go-base
        out: "./src/services/auth/queries/"
        package: "queries"
        emit_prepared_queries: true
        emit_empty_slices: true
        initialisms: []
        overrides:
          - db_type: "uuid"
            go_type: "uuid.UUID"
          - db_type: "uuid"
            nullable: true
            go_type:
              type: "uuid.UUID"
              pointer: true
          # - db_type: "timestamptz"
          #   nullable: true
          #   go_type:
          #     type: "time.Time"
          #     pointer: true

  - engine: "postgresql"
    schema: "./src/services/shortening/db/migrations/"
    queries: "./src/services/shortening/db/queries.sql"
    gen:
      go:
        <<: *go-base
        out: "./src/services/shortening/queries/"

  - engine: "postgresql"
    schema: "./src/services/redirection/db/migrations/"
    queries: "./src/services/redirection/db/queries.sql"
    gen:
      go:
        <<: *go-base
        out: "./src/services/redirection/queries/"
